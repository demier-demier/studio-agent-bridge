[package]
name = "scenward-cache"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded, zero-copy analysis of recorded granular particle frames"

[lib]
name = "scenward_cache"
crate-type = ["cdylib"]

[dependencies]
numpy = "=0.30.0"
pyo3 = { version = "=0.30.1", features = ["extension-module"] }

[profile.release]
lto = "thin"
codegen-units = 1
