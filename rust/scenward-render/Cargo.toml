[package]
name = "scenward-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Rust GPU rendering of recorded robotics and granular scenes"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "27"
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
