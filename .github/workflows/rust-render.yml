name: Rust render build and cache checks
on:
  push:
    paths: ['rust/scenward-render/**', '.github/workflows/rust-render.yml']
  pull_request:
    paths: ['rust/scenward-render/**', '.github/workflows/rust-render.yml']
permissions:
  contents: read
jobs:
  build-and-validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust/scenward-render
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Compile native renderer (not a GPU execution test)
        run: cargo build --locked
  native-robotics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust/scenward-render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mujoco==3.3.7 numpy
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Locate official native SDK
        run: python -c "import mujoco,pathlib,os; open(os.environ['GITHUB_ENV'],'a').write('MUJOCO_DIR='+str(pathlib.Path(mujoco.__file__).parent)+'\n')"
      - run: cargo test --locked --features robotics
      - run: cargo clippy --locked --all-targets --features robotics -- -D warnings
      - name: Verify archived profile report consistency (not GPU execution)
        run: python scripts/check_profile.py evidence/profile-full-2026-10-31.json
      - name: Native articulated locomotion check (CPU, no GPU claim)
        run: cargo run --locked --features robotics -- --run unused --geometry unused --robot-check --model ../../examples/solo12_granular/locomotion/solo12-walk.xml
