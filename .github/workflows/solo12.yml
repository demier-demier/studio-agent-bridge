name: Solo12 portable CPU checks
on:
  push:
    paths:
      - 'examples/solo12_granular/**'
      - '.github/workflows/solo12.yml'
  pull_request:
    paths:
      - 'examples/solo12_granular/**'
      - '.github/workflows/solo12.yml'
permissions:
  contents: read
jobs:
  portable-cpu-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/solo12_granular/requirements.txt
      - run: python -m pip install -r examples/solo12_granular/requirements.txt
      - name: Packaged model, controller and video particle-count contracts
        run: python -m unittest discover -s examples/solo12_granular/tests -v
      - name: Analytic contact and grid-migration checks
        run: python examples/solo12_granular/check_granular.py --backend cpu
      - name: Small coupled smoke run (not the full video benchmark)
        run: python examples/solo12_granular/simulate.py --preset smoke --arch cpu --output runs/solo12-ci
      - name: Independent smoke trajectory audit
        run: python examples/solo12_granular/locomotion/audit_run.py runs/solo12-ci --minimum-travel 0
      - name: Windows setup and launcher from a directory with spaces
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'examples/solo12_granular'
          $python = (Get-Command python).Source
          $venv = Join-Path $env:RUNNER_TEMP 'Solo12 clean environment'
          & "$root/windows/setup.ps1" -PythonCommand $python -EnvironmentPath $venv
          $outside = Join-Path $env:RUNNER_TEMP 'Unrelated working directory'
          New-Item -ItemType Directory -Path $outside | Out-Null
          Set-Location $outside
          $output = Join-Path $outside 'CPU smoke run'
          & "$root/windows/run.ps1" -Vendor CPU -Preset smoke -Python "$venv/Scripts/python.exe" -OutputDirectory $output
          # Repeat must fail without altering the saved trajectory.
          $before = (Get-FileHash "$output/particles.npy" -Algorithm SHA256).Hash
          $rejected = $false
          try {
            & "$root/windows/run.ps1" -Vendor CPU -Python "$venv/Scripts/python.exe" -OutputDirectory $output
          } catch { $rejected = $true }
          if (-not $rejected) { throw 'Existing output was not rejected' }
          if ((Get-FileHash "$output/particles.npy" -Algorithm SHA256).Hash -ne $before) { throw 'Existing output changed' }
      - name: Save CPU evidence (not GPU validation)
        uses: actions/upload-artifact@v4
        with:
          name: solo12-${{ matrix.os }}-cpu-evidence
          path: |
            runs/solo12-ci/metadata.json
            runs/solo12-ci/audit.json
          retention-days: 14
